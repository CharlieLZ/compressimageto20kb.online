name: Site integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/compression-flow.test.cjs scripts/guide-tools.test.cjs
      - run: python3 scripts/verify_guides.py
      - run: python3 scripts/verify_sitemap.py
      - run: python3 scripts/verify_seo_discovery.py
